<div>
  <label for="subfolder-input" class="block text-sm font-medium text-gray-300 mb-2">
    Folder Name
    <span class="text-gray-500 font-normal">(optional)</span>
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
      </svg>
    </div>
    <input id="subfolder-input" type="text"
      [ngModel]="folderName()"
      (ngModelChange)="onFolderNameChange($event)"
      [disabled]="disabled()"
      [class.bg-gray-700]="disabled()"
      placeholder="e.g. session-01"
      class="w-full pr-3 py-2 !pl-[38px] border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed" 
      />
  </div>
  <p class="mt-1 text-xs text-gray-500">
    Leave empty to save directly in the captures folder.
  </p>
</div>
